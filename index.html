<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>До встречи с Алиной — чат</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: как ваша переписка — свой, смешной, родной
   IDEA: страница выглядит как чат в Телеграме с Алиной
   PICTURE: фото как присланная картинка, таймер — закреплённое сообщение
   COLOUR and TYPE: обои чата в зелёно-жёлтых тонах, белые и мятные пузыри; Inter
   LAYOUT: одна колонка-телефон по центру, шапка, закреп, лента, поле ввода */
:root{color-scheme:light dark;--wall1:light-dark(#d7e7b4,#0f1a12);--wall2:light-dark(#9fc79a,#1d2b1e);--in:light-dark(#fff,#212d3b);--out:light-dark(#e3fec6,#2b5278);--ink:light-dark(#111,#f2f5f8);--meta:light-dark(#5e8a4e,#8eb4d4);--bar:light-dark(#ffffff,#17212b);--acc:#3a9be0}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:16px/1.4 "Inter",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--wall1),var(--wall2));min-height:100vh;display:flex;justify-content:center;overflow-x:clip}
.app{width:100%;max-width:560px;min-height:100vh;display:flex;flex-direction:column;position:relative}
.wall{position:fixed;inset:0;pointer-events:none;opacity:.13;font-weight:800;color:light-dark(#2d5b22,#a8d8a0);overflow:hidden}
.wall span{position:absolute;transform:rotate(var(--r));white-space:nowrap}
header{position:sticky;top:0;z-index:3;background:var(--bar);display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(#ff8d6b,#f2566e);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
header b{display:block;font-size:17px}header small{color:var(--acc);font-size:14px}
.pin{position:sticky;top:62px;z-index:2;background:var(--bar);border-top:1px solid light-dark(#eee,#0e1621);padding:7px 16px 8px 26px;font-size:14px;position:sticky}
.pin::before{content:"";position:absolute;left:14px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--acc)}
.pin i{font-style:normal;color:var(--acc);font-weight:600;display:block;font-size:13px}
.feed{flex:1;padding:16px 10px 90px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.day{align-self:center;background:rgba(0,0,0,.18);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px;margin:8px 0}
.m{max-width:82%;padding:7px 11px 6px;border-radius:16px;background:var(--in);box-shadow:0 1px 1px rgba(0,0,0,.12);position:relative}
.m.o{align-self:flex-end;background:var(--out);border-bottom-right-radius:5px}
.m:not(.o){align-self:flex-start;border-bottom-left-radius:5px}
.m time{float:right;margin:6px 0 -4px 10px;font-size:12px;color:var(--meta)}
.photo{padding:4px;max-width:88%;cursor:pointer}
.photo img{display:block;width:100%;border-radius:13px}
.photo p{margin:6px 6px 2px;font-weight:600;min-height:1.4em;transition:opacity .2s}
.fade{opacity:0}
.big{align-self:stretch;max-width:none;padding:16px 14px 12px}
.big h1{margin:0 0 12px;font-size:clamp(24px,6vw,34px);line-height:1.05;font-weight:800;letter-spacing:-.01em}
.cd{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr));gap:8px}
.cd div{background:light-dark(#f3fbe9,#1b3b5a);border-radius:12px;text-align:center;padding:10px 2px 8px}
.cd b{display:block;font-size:clamp(24px,7vw,40px);font-weight:800;font-variant-numeric:tabular-nums;color:light-dark(#2f7d1f,#9fd0ff);white-space:nowrap}
.cd span{font-size:13px;color:var(--meta)}
.done{display:none;font-size:28px;font-weight:800}body.met .cd{display:none}body.met .done{display:block}
.react{display:inline-block;margin-top:6px;background:light-dark(#d4f0bd,#3a6894);border-radius:12px;padding:1px 8px;font-size:14px}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:3;display:flex;gap:8px;padding:8px 10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.06))}
footer form{display:flex;gap:8px;width:100%}
footer input{flex:1;font:16px "Inter",sans-serif;color:var(--ink);background:var(--bar);border:0;border-radius:22px;padding:12px 16px;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.12)}
footer input:focus-visible{box-shadow:0 0 0 2px var(--acc)}
footer input::placeholder{color:var(--meta)}
footer button{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:18px;cursor:pointer;flex:none}
footer button:focus-visible{outline:3px solid #fff;outline-offset:-5px}
.riddle{border:2px dashed light-dark(#9fd38a,#4b7aa6)}
.riddle b{display:block;margin-bottom:2px}
.m,.typing{scroll-margin-bottom:96px}
.typing{align-self:flex-start;background:var(--in);border-radius:16px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--meta);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25;transform:translateY(-3px)}}
.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}}
.conf{position:fixed;top:-20px;z-index:9;pointer-events:none;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.typing i,.pop,.conf{animation:none}.conf{display:none}}
</style></head><body>
